<style>
    /* --- ESTILOS GENERALES Y RESETEO --- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { 
        --primary: #2d3e2f; 
        --accent: #c4a676; 
        --dark: #1a1a1a; 
        --light: #f9f8f6; 
        --white: #ffffff; 
        --shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    
    /* CORRECCIÓN 1: Asegurar que nada se salga del ancho de pantalla */
    html, body { 
        width: 100%;
        max-width: 100%;
        overflow-x: hidden; /* Corta cualquier desbordamiento rebelde */
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        color: var(--dark); 
        background: var(--white); 
        line-height: 1.6; 
    }
    
    /* --- NAVEGACIÓN RESPONSIVE --- */
    nav { position: fixed; top: 0; width: 100%; padding: 1.5rem 5%; background: transparent; z-index: 1000; transition: all 0.4s ease; }
    nav.scrolled { background: rgba(255,255,255,0.98); padding: 1rem 5%; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    nav .container { max-width: 1600px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: Georgia, serif; font-size: 1.8rem; font-weight: 300; color: var(--white); letter-spacing: 6px; cursor: pointer; z-index: 1002; }
    nav.scrolled .logo { color: var(--primary); }
    
    .nav-right { display: flex; align-items: center; gap: 2rem; }
    .nav-links { display: flex; list-style: none; gap: 2.5rem; }
    .nav-links a { text-decoration: none; color: var(--white); font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; transition: color 0.3s; }
    nav.scrolled .nav-links a { color: var(--primary); }
    nav.scrolled .nav-links a:hover { color: var(--accent); }

    .cart-icon-container { position: relative; cursor: pointer; font-size: 1.4rem; color: var(--white); z-index: 1002; }
    nav.scrolled .cart-icon-container { color: var(--primary); }
    .cart-badge { position: absolute; top: -5px; right: -8px; background: var(--accent); color: var(--white); font-size: 0.6rem; font-weight: 700; padding: 2px 6px; border-radius: 10px; display: none; }

    /* Menú Hamburguesa */
    .menu-toggle { display: none; flex-direction: column; gap: 5px; cursor: pointer; z-index: 1002; }
    .bar { width: 25px; height: 2px; background-color: var(--white); transition: 0.3s; }
    nav.scrolled .bar { background-color: var(--primary); }

    /* --- CARRITO & MODALES (CORRECCIÓN 2: Usar 100% en lugar de 100vw) --- */
    .cart-overlay, .checkout-modal, .image-zoom-modal { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
        z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; 
    }
    .cart-overlay.active, .checkout-modal.active, .image-zoom-modal.active { opacity: 1; pointer-events: all; }
    
    .cart-sidebar { 
        position: fixed; top: 0; right: -100%; width: 90%; max-width: 400px; height: 100vh; 
        background: var(--white); z-index: 10000; transition: right 0.4s cubic-bezier(0.77, 0, 0.175, 1); 
        display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0,0,0,0.1);
    }
    .cart-sidebar.active { right: 0; }
    
    /* Checkout Form */
    .checkout-modal { padding: 0 1rem; }
    .checkout-content { 
        background: var(--white); padding: 2rem; border-radius: 8px; 
        width: 100%; max-width: 500px; 
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }

    /* Modal Zoom */
    .image-zoom-modal { z-index: 10001; }
    .image-zoom-content {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        max-width: 95%; max-height: 95%; width: auto; height: auto;
    }
    .image-zoom-content img {
        max-width: 100%; max-height: 90vh; border-radius: 4px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); object-fit: contain; 
    }
    .zoom-close {
        position: absolute; top: 10px; right: 10px; color: white; font-size: 2rem; background: none; border: none; cursor: pointer; text-shadow: 0 0 5px rgba(0,0,0,0.5);
    }

    /* --- SECCIONES PRINCIPALES --- */
    .hero { height: 100vh; position: relative; display: flex; align-items: center; justify-content: center; }
    .hero-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('https://i.imgur.com/gZWu46S.jpeg'); background-size: cover; background-position: center; filter: brightness(0.65); }
    .hero-content { position: relative; z-index: 2; text-align: center; color: var(--white); max-width: 800px; padding: 2rem; }
    .hero h1 { font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 300; letter-spacing: 2px; margin-bottom: 1.5rem; font-family: Georgia, serif; line-height: 1.1; }
    
    .story-grid { display: grid; grid-template-columns: 1fr 1fr; min-height: 80vh; }
    .story-image-container { height: 100%; min-height: 400px; }
    .story-image-container img { width: 100%; height: 100%; object-fit: cover; }
    .story-content { display: flex; flex-direction: column; justify-content: center; padding: 5rem; background: var(--white); }
    .story h2 { font-size: clamp(2rem, 4vw, 3rem); color: var(--primary); margin-bottom: 1.5rem; font-family: Georgia, serif; font-weight: 300; }
    .story-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-top: 3rem; padding-top: 2rem; border-top: 1px solid #eee; }
    
    .products { padding: 6rem 5%; background: #fbfbfb; }
    
    /* CORRECCIÓN 3: Grid más flexible (bajar minmax de 300px a 260px) */
    .products-grid { 
        display: grid; 
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); 
        gap: 2rem; 
        max-width: 1200px; 
        margin: 0 auto; 
    }
    
    .product-image { 
        width: 100%; 
        height: clamp(350px, 60vh, 450px); 
        position: relative; 
        background: #fff; 
        overflow: hidden;
        cursor: zoom-in;
    }
    
    .product-slider { display: flex; width: 100%; height: 100%; transition: transform 0.5s ease; }
    .product-slide { width: 100%; height: 100%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;}
    
    /* Elementos generales (botones, textos, etc) del código original */
    .product-cta, .btn-primary, .btn-secondary, .contact-btn { padding: 1rem 2.5rem; font-size: 0.9rem; }
    .cart-header { padding: 1.5rem; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .cart-header h2 { font-family: Georgia, serif; color: var(--primary); }
    .cart-close { background: none; border: none; font-size: 2rem; cursor: pointer; color: var(--dark); }
    .cart-items { flex: 1; overflow-y: auto; padding: 1.5rem; }
    .cart-empty { text-align: center; padding: 3rem 1rem; opacity: 0.5; }
    .cart-item { display: grid; grid-template-columns: 70px 1fr auto; gap: 1rem; margin-bottom: 1.5rem; align-items: center; }
    .cart-item-image { width: 70px; height: 70px; object-fit: cover; border-radius: 4px; }
    .cart-item h3 { font-size: 0.9rem; margin-bottom: 0.3rem; }
    .qty-btn { width: 24px; height: 24px; border: 1px solid #ddd; background: #fff; cursor: pointer; border-radius: 3px; }
    .cart-footer { padding: 1.5rem; border-top: 1px solid #eee; background: #fafafa; }
    .cart-total { display: flex; justify-content: space-between; margin-bottom: 1.5rem; font-size: 1.2rem; font-weight: 700; color: var(--primary); }
    .checkout-btn { width: 100%; padding: 1rem; background: var(--primary); color: white; border: none; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: background 0.3s; }
    .checkout-btn:hover { background: var(--accent); }
    .checkout-btn:disabled { background: #ccc; cursor: not-allowed; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; font-weight: 600; color: var(--primary); }
    .form-control { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; }
    .payment-info { background: #f0fdf4; padding: 1rem; border: 1px solid #bbf7d0; border-radius: 4px; margin-top: 1rem; display: none; color: #166534; font-size: 0.9rem; }
    .payment-info.show { display: block; }
    .btn-whatsapp { width: 100%; padding: 1rem; background: #25D366; color: white; border: none; font-weight: 600; border-radius: 4px; cursor: pointer; margin-top: 1.5rem; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
    .hero-subtitle { font-size: 1rem; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 1rem; opacity: 0.9; }
    .hero-description { font-size: 1.1rem; margin-bottom: 2.5rem; max-width: 600px; margin-left: auto; margin-right: auto; opacity: 0.9; }
    .hero-cta { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn-primary, .btn-secondary { font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; text-decoration: none; transition: all 0.3s ease; border-radius: 2px; }
    .btn-primary { background: var(--accent); color: var(--white); border: 1px solid var(--accent); }
    .btn-primary:hover { background: transparent; border-color: var(--white); }
    .btn-secondary { background: transparent; color: var(--white); border: 1px solid var(--white); }
    .btn-secondary:hover { background: var(--white); color: var(--primary); }
    .story-label { color: var(--accent); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; font-size: 0.8rem; margin-bottom: 1rem; }
    .stat-number { font-size: 1.8rem; color: var(--accent); font-family: Georgia, serif; display: block; margin-bottom: 0.5rem; }
    .stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }
    .section-header { text-align: center; max-width: 700px; margin: 0 auto 4rem; }
    .section-label { color: var(--accent); font-size: 0.8rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; display: block; margin-bottom: 0.5rem; }
    .section-title { font-size: 2.5rem; color: var(--primary); font-family: Georgia, serif; margin-bottom: 1rem; }
    .product-card { background: var(--white); border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; transition: transform 0.3s ease; }
    .product-card:hover { transform: translateY(-5px); }
    .product-slide img { width: 100%; height: 100%; object-fit: contain; padding: 20px; }
    .product-slider-wrapper { width: 100%; overflow: hidden; height: 100%; position: relative; }
    .slider-arrows { position: absolute; top: 50%; width: 100%; display: flex; justify-content: space-between; padding: 0 10px; transform: translateY(-50%); pointer-events: none; }
    .slider-arrow { width: 35px; height: 35px; background: rgba(255,255,255,0.9); border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; pointer-events: all; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .product-badge { position: absolute; top: 15px; right: 15px; background: var(--primary); color: var(--white); padding: 5px 12px; font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase; z-index: 5; }
    .product-info { padding: 2rem; flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; }
    .product-info h3 { font-size: 1.5rem; color: var(--primary); margin-bottom: 0.5rem; font-family: Georgia, serif; }
    .product-price { font-size: 1.4rem; color: var(--accent); font-weight: 600; margin-bottom: 1rem; font-family: Georgia, serif; }
    .product-description { font-size: 0.95rem; color: #666; margin-bottom: 1.5rem; line-height: 1.6; }
    .product-features { display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .feature-tag { padding: 4px 10px; background: #f4f4f4; color: var(--dark); border-radius: 4px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }
    .product-cta { background: var(--primary); color: var(--white); border: none; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: background 0.3s; margin-top: auto; }
    .product-cta:hover { background: var(--accent); }
    .product-cta:disabled { background: #e0e0e0; color: #999; cursor: default; }
    .coming-soon-placeholder { width: 100%; height: 100%; background: #f0f0f0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ccc; }
    .coming-soon-placeholder span { font-size: 3rem; font-family: Georgia, serif; }
    .fondo-final { position: relative; background-image: url('https://imgur.com/pYk1UxL.jpeg'); background-size: cover; background-position: center; color: var(--white); }
    .fondo-final::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(20, 20, 20, 0.85); z-index: 0; }
    .contact, footer { position: relative; z-index: 1; background: transparent; }
    .contact { padding: 6rem 5%; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .contact h2 { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 300; margin-bottom: 1.5rem; font-family: Georgia, serif; }
    .contact p { font-size: 1.2rem; margin-bottom: 3rem; max-width: 600px; margin-left: auto; margin-right: auto; opacity: 0.9; }
    .contact-buttons { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }
    .contact-btn { background: var(--accent); color: var(--white); text-decoration: none; letter-spacing: 2px; text-transform: uppercase; border: 1px solid var(--accent); transition: 0.3s; }
    .contact-btn:hover { background: transparent; border-color: var(--white); }
    .contact-btn.outline { background: transparent; border: 1px solid var(--white); }
    .contact-btn.outline:hover { background: var(--white); color: var(--primary); }
    footer { padding: 4rem 5%; }
    .footer-content { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 3rem; }
    .footer-brand h3 { font-family: Georgia, serif; font-size: 1.5rem; letter-spacing: 4px; margin-bottom: 1rem; }
    .footer-links h4 { font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 1.5rem; color: var(--accent); }
    .footer-links ul { list-style: none; }
    .footer-links a { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.9rem; display: block; margin-bottom: 0.8rem; transition: color 0.3s; }
    .footer-links a:hover { color: var(--white); }
    .footer-bottom { max-width: 1200px; margin: 3rem auto 0; padding-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1); text-align: center; font-size: 0.8rem; opacity: 0.5; }

    /* --- MEDIA QUERIES (BREAKPOINTS) --- */
    @media (max-width: 992px) {
        .story-grid { grid-template-columns: 1fr; }
        .story-image-container { height: 400px; min-height: auto; }
        .story-content { padding: 3rem 2rem; }
        .footer-content { grid-template-columns: 1fr; gap: 2rem; text-align: center; }
        .nav-links { gap: 0; }
    }

    @media (max-width: 768px) {
        /* CORRECCIÓN 4: Menú Móvil Full Width real */
        nav { padding: 1rem 0; } /* Quitamos padding al nav padre */
        nav .container { padding: 0 1rem; width: 100%; } /* Padding interno al container */
        
        .menu-toggle { display: flex; }
        .nav-links { 
            position: absolute; top: 100%; left: 0; width: 100%; background: var(--white); 
            flex-direction: column; gap: 0; max-height: 0; overflow: hidden; transition: 0.4s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .nav-links.active { max-height: 300px; }
        .nav-links a { display: block; padding: 1.2rem; color: var(--primary); border-bottom: 1px solid #f5f5f5; width: 100%; text-align: center; }
        
        .hero h1 { font-size: clamp(2rem, 9vw, 3rem); }
        .products-grid { max-width: 450px; } 
        .contact-buttons { flex-direction: column; width: 100%; }
        .contact-btn { width: 100%; text-align: center; }
    }
</style>
